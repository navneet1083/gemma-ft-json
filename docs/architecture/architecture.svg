<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <style>
      .box{rx:10;ry:10;stroke-width:1.5}
      .t{font-size:13px;fill:#0f172a}
      .tb{font-size:14px;font-weight:bold;fill:#0f172a}
      .sub{font-size:11px;fill:#475569}
      .lbl{font-size:11px;fill:#334155}
      .frozen{fill:#dbeafe;stroke:#3b82f6}
      .trained{fill:#dcfce7;stroke:#22c55e}
      .data{fill:#fef9c3;stroke:#eab308}
      .out{fill:#fae8ff;stroke:#a855f7}
      .loss{fill:#ffe4e6;stroke:#f43f5e}
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="720" fill="#f8fafc"/>
  <text x="32" y="40" class="tb" font-size="22">gemma-ft-json · Architecture (image → structured JSON)</text>
  <text x="32" y="64" class="sub">Frozen vision encoder → trained projector → Gemma 3 270M decoder (LoRA). Fully offline: no Hugging Face downloads.</text>

  <!-- offline boundary -->
  <rect x="24" y="86" width="1132" height="486" fill="none" stroke="#94a3b8" stroke-dasharray="6 5" rx="14"/>
  <text x="40" y="106" class="lbl" font-style="italic">Offline boundary — weights load only from local dirs (HF_HUB_OFFLINE=1, TRANSFORMERS_OFFLINE=1)</text>

  <!-- INPUT -->
  <rect class="box data" x="40" y="130" width="160" height="92"/>
  <text x="120" y="162" class="tb" text-anchor="middle">Input image</text>
  <text x="120" y="184" class="sub" text-anchor="middle">page / table crop</text>
  <text x="120" y="202" class="sub" text-anchor="middle">PNG · JPG · TIFF</text>

  <!-- TRANSFORM -->
  <rect class="box data" x="240" y="130" width="180" height="92"/>
  <text x="330" y="158" class="tb" text-anchor="middle">Letterbox + norm</text>
  <text x="330" y="180" class="sub" text-anchor="middle">aspect-preserving</text>
  <text x="330" y="198" class="sub" text-anchor="middle">[3, S, S]</text>

  <!-- ENCODER -->
  <rect class="box frozen" x="460" y="120" width="200" height="112"/>
  <text x="560" y="150" class="tb" text-anchor="middle">Vision encoder</text>
  <text x="560" y="172" class="sub" text-anchor="middle">SigLIP-2 (local) OR</text>
  <text x="560" y="190" class="sub" text-anchor="middle">from-scratch ViT</text>
  <text x="560" y="214" class="lbl" text-anchor="middle">❄ FROZEN → [B, N, Dv]</text>

  <!-- PROJECTOR -->
  <rect class="box trained" x="700" y="120" width="180" height="112"/>
  <text x="790" y="150" class="tb" text-anchor="middle">Projector (MLP)</text>
  <text x="790" y="172" class="sub" text-anchor="middle">fc1→GELU→fc2</text>
  <text x="790" y="190" class="sub" text-anchor="middle">Dv → H</text>
  <text x="790" y="214" class="lbl" text-anchor="middle">✓ TRAINED soft tokens</text>

  <!-- PROMPT -->
  <rect class="box data" x="40" y="300" width="160" height="92"/>
  <text x="120" y="332" class="tb" text-anchor="middle">Prompt text</text>
  <text x="120" y="354" class="sub" text-anchor="middle">"Extract the</text>
  <text x="120" y="372" class="sub" text-anchor="middle">table as JSON."</text>

  <!-- TOKENIZER -->
  <rect class="box frozen" x="240" y="300" width="180" height="92"/>
  <text x="330" y="332" class="tb" text-anchor="middle">Tokenizer</text>
  <text x="330" y="354" class="sub" text-anchor="middle">Offline Gemma OR</text>
  <text x="330" y="372" class="sub" text-anchor="middle">byte-level fallback</text>

  <!-- EMBED -->
  <rect class="box frozen" x="460" y="300" width="200" height="92"/>
  <text x="560" y="332" class="tb" text-anchor="middle">Token embeddings</text>
  <text x="560" y="354" class="sub" text-anchor="middle">decoder.embed_tokens</text>
  <text x="560" y="372" class="sub" text-anchor="middle">[B, T, H]</text>

  <!-- CONCAT -->
  <rect class="box out" x="700" y="262" width="180" height="92"/>
  <text x="790" y="294" class="tb" text-anchor="middle">Concat sequence</text>
  <text x="790" y="316" class="sub" text-anchor="middle">[ soft tokens | text ]</text>
  <text x="790" y="334" class="sub" text-anchor="middle">[B, N+T, H]</text>

  <!-- DECODER -->
  <rect class="box frozen" x="920" y="120" width="216" height="234"/>
  <text x="1028" y="150" class="tb" text-anchor="middle">Gemma 3 270M decoder</text>
  <text x="1028" y="172" class="sub" text-anchor="middle">causal transformer</text>
  <text x="1028" y="190" class="lbl" text-anchor="middle">❄ base FROZEN</text>
  <rect class="box trained" x="948" y="206" width="160" height="64"/>
  <text x="1028" y="232" class="t" text-anchor="middle" font-weight="bold">LoRA adapters</text>
  <text x="1028" y="252" class="sub" text-anchor="middle">✓ q_proj, v_proj</text>
  <text x="1028" y="300" class="sub" text-anchor="middle">logits [B, N+T, V]</text>
  <text x="1028" y="322" class="sub" text-anchor="middle">(hidden · Wlmᵀ)</text>

  <!-- OUTPUT JSON -->
  <rect class="box out" x="920" y="430" width="216" height="92"/>
  <text x="1028" y="462" class="tb" text-anchor="middle">Structured JSON</text>
  <text x="1028" y="484" class="sub" text-anchor="middle">greedy decode, low temp</text>
  <text x="1028" y="502" class="sub" text-anchor="middle">schema-constrained (opt.)</text>

  <!-- LOSS -->
  <rect class="box loss" x="620" y="430" width="260" height="118"/>
  <text x="750" y="458" class="tb" text-anchor="middle">Faithful LM loss</text>
  <text x="750" y="480" class="sub" text-anchor="middle">shifted masked cross-entropy</text>
  <text x="750" y="498" class="sub" text-anchor="middle">prompt + vision = −100 (ignored)</text>
  <text x="750" y="516" class="sub" text-anchor="middle">content tokens up-weighted ×1.5</text>
  <text x="750" y="534" class="sub" text-anchor="middle">NaN/Inf guarded</text>

  <!-- arrows: image path -->
  <line x1="200" y1="176" x2="238" y2="176" stroke="#334155" marker-end="url(#arrow)"/>
  <line x1="420" y1="176" x2="458" y2="176" stroke="#334155" marker-end="url(#arrow)"/>
  <line x1="660" y1="176" x2="698" y2="176" stroke="#334155" marker-end="url(#arrow)"/>
  <line x1="880" y1="200" x2="918" y2="220" stroke="#334155" marker-end="url(#arrow)"/>
  <line x1="790" y1="232" x2="790" y2="260" stroke="#334155" marker-end="url(#arrow)"/>

  <!-- arrows: text path -->
  <line x1="200" y1="346" x2="238" y2="346" stroke="#334155" marker-end="url(#arrow)"/>
  <line x1="420" y1="346" x2="458" y2="346" stroke="#334155" marker-end="url(#arrow)"/>
  <line x1="660" y1="346" x2="698" y2="330" stroke="#334155" marker-end="url(#arrow)"/>
  <line x1="880" y1="300" x2="918" y2="270" stroke="#334155" marker-end="url(#arrow)"/>

  <!-- decoder to logits/loss/json -->
  <line x1="1028" y1="354" x2="1028" y2="428" stroke="#334155" marker-end="url(#arrow)"/>
  <line x1="918" y1="476" x2="882" y2="476" stroke="#f43f5e" marker-end="url(#arrow)"/>
  <text x="892" y="420" class="lbl" text-anchor="middle">train</text>
  <text x="1052" y="410" class="lbl">infer</text>

  <!-- training-only note on loss backprop -->
  <line x1="750" y1="430" x2="750" y2="360" stroke="#f43f5e" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="616" y="392" class="lbl" text-anchor="end">∇ updates projector + LoRA only</text>

  <!-- legend -->
  <text x="32" y="612" class="tb">Legend</text>
  <rect class="box frozen" x="32" y="624" width="22" height="16"/><text x="62" y="637" class="t">Frozen (no grad)</text>
  <rect class="box trained" x="200" y="624" width="22" height="16"/><text x="230" y="637" class="t">Trained</text>
  <rect class="box data" x="330" y="624" width="22" height="16"/><text x="360" y="637" class="t">Data / preprocessing</text>
  <rect class="box out" x="520" y="624" width="22" height="16"/><text x="550" y="637" class="t">Sequence / output</text>
  <rect class="box loss" x="660" y="624" width="22" height="16"/><text x="690" y="637" class="t">Loss (training only)</text>

  <text x="32" y="678" class="sub">Pipeline (decoupled, PaddleOCR-VL-style): [layout detect →] image → encoder(frozen) → projector(trained) → Gemma+LoRA → JSON assembler.</text>
  <text x="32" y="697" class="sub">Anti-forgetting: frozen base + LoRA. Faithfulness: prompt/vision masking, content up-weighting, greedy decoding, optional grounding + RL.</text>
</svg>
