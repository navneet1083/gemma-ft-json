[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# PIP/PEP-503 naming: distribution name uses hyphens, import package uses underscores.
name = "gemma-ft-json"
version = "0.1.0"
description = "Image-to-JSON fine-tuning of Gemma 3 270M via a from-scratch table-biased vision encoder, RMS-calibrated projector, and LoRA (fully offline, MPS-first)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Navneet Singh" }]
dependencies = [
  "torch>=2.3",
  "transformers>=4.50",   # used ONLY to load LOCAL weights (offline mode enforced in code)
  "pyyaml>=6.0",
  "numpy>=1.26",
  "pillow>=10.0",
  "matplotlib>=3.8",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["jupyter", "ipykernel", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]
